# SPDX-License-Identifier: CC0-1.0
#
# Catalyst screening scenario "zero" = carbon-neutral, done the way pypsa-earth does it by default: the
# existing fleet stays in the model (fossil units cannot run under the zero cap, nuclear / hydro / existing
# wind and solar keep operating), the default extendables (solar, wind, battery, H2 store, lines via
# ll=copt) are built at 2050 costs, and the opts wildcard Co2L0 sets the CO2 limit to 0 (co2.base * 0).
# Since 2026-09-30 the starting point is the same calibrated 2024 system as in overlay.now.yaml (fleet,
# hydro energy, fuel prices, envelopes; statistics.yaml), but nothing is frozen: expansion is allowed on top of it.
# Since 2026-10-04 demand is the 2050 table of the demand pathway (scripts/build_demand_pathway.py: 2024
# demand x a consensus of published outlooks, about x1.77 world-wide), matching the 2050 costs.
# Applied by config-pypsa-earth/run.sh on top of config.<R>.yaml for a stage named <R>-zero.
scenario:
  simpl: [""]
  ll: [copt]
  opts: [Co2L0-3h]      # 3h: see overlay.now.yaml

costs:
  year: 2050            # technology-data v0.13.2 costs_2050.csv

load_options:
  annual_totals: ../../config-pypsa-earth/calibration/2050/demand.csv   # the demand pathway's 2050 table

catalyst:
  envelope: nofloor     # no must-run on emitting carriers under Co2L0 (merge_config.py)

calibration:            # fork: scripts/calibrate_network.py; expansion allowed
  enable: true
  brownfield_only: false
  efficiency_spread: 0.15   # 3 tranches per fuel-burning generator: x0.85, x1.0, x1.15 of the fleet efficiency
  tranches: 3
  net_import_tolerance: 0.25
  tables:
    net_imports: ../../config-pypsa-earth/calibration/2024/net_imports.csv

enable:
  build_cutout: false

custom_rules:
  - ../../config-pypsa-earth/validation.smk

solving:
  solver_options:
    gurobi-default:
      threads: 8
