# SPDX-License-Identifier: CC0-1.0
#
# Catalyst / WP1: contiguous-US (CONUS) power-only prenetwork, STAGE A (smoke test).
# Diff over pypsa-earth config.default.yaml; copied to models/pypsa-earth/config.yaml
# by config-pypsa-earth/run_us.sh. One month of weather so every rule runs end-to-end fast.
# Stage B (config.US.yaml) is identical except run name, snapshots and cutout name.

countries: [US]

run:
  name: US-smoke
  shared_cutouts: true

scenario:
  simpl: [""]            # empty: simplify_network skips its pre-clustering (no solver call)
  clusters: [50]
  ll: [copt]
  opts: [Co2L]

snapshots:
  start: "2013-01-01"
  end: "2013-02-01"
  inclusive: left

enable:
  retrieve_databundle: true
  retrieve_cost_data: true
  retrieve_cutout: false  # prebuilt North-America cutout is 29.5 GB zipped; build a CONUS one instead
  build_cutout: true      # needs ~/.cdsapirc; bounds fixed below, time = snapshots
  download_osm_data: true
  build_natura_raster: false
  progress_bar: false

download_osm_data_nprocesses: 1   # fork patch: earth-osm single process

atlite:
  nprocesses: 1
  default: cutout-2013-era5-conus-jan
  cutouts:
    cutout-2013-era5-conus-jan:
      module: era5
      dx: 0.3
      dy: 0.3
      x: [-125.0, -66.5]   # CONUS; auto-bounds would span the globe because of Alaska/Hawaii
      y: [24.0, 50.0]

electricity:
  renewable_carriers: [solar, onwind, offwind-ac, offwind-dc, hydro]

build_shape_options:
  nprocesses: 1
  gdp_method: false       # smoke test only: demand distributed by population (fork fallback patch); stage B uses the GDP raster
  clip_bbox: [-125.0, 24.0, -66.5, 50.0]   # fork patch: drop Alaska, Hawaii, Pacific EEZ

solving:
  solver:
    name: gurobi          # only cluster_network's MIQP uses it before prepare_network; scip is the fallback
