#
# Reference pathway (SOW §1.3 S1, no catalytic intervention) of the 24/7 CFE comparison: the myopic pathway
# (overlay.myopic.yaml, inherited) with its own learning market results/learning/ref/, so it never mixes with other
# myopic markets. Same palette, demand, fuel and CO2 prices as overlay.cfe.yaml, just without the buyer.
# learning_spillover 1 = only the modelled builds learn (the secluded case); if the reference builds advanced
# technologies itself, the midpoint / extrapolated cases need reference branches of their own.
inherit: myopic

catalyst:
  learning_spillover: 1            # what the unmodelled rest of the world builds of the advanced technologies the modelled regions build:
                                   # clear_market.py multiplies the modelled builds by m before they enter Wright's law (cumulative capacity),
                                   # share = the modelled regions' share of 2024 world demand (JP 3.29 %); values:
                                   #   1 (or unset)  secluded: only the modelled builds count                              (JP x1)  <- this overlay
                                   #   midpoint      m = sqrt(1/share), the geometric middle of the two extremes           (JP x5.5)
                                   #   extrapolate   m = 1/share: the rest of the world builds as much per MWh of demand   (JP x30.4)
                                   #   <number>      m as given, e.g. 2
                                   # exogenous deployment (LEARNING_EXOGENOUS) is not scaled; all stages of one market need the same value
