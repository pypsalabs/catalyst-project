#
# GENERATED by config-pypsa-earth/scripts/select_countries.py - edit the script, not this file.
# Catalyst / rest of world, group MEA (Middle East, Turkey and the Caucasus): 18 countries, each ONE NODE and islanded, power-only, weather year 2013.
# SA Saudi Arabia, IR Iran (Islamic Republic of), TR Turkey, AE United Arab Emirates, IQ Iraq, KW Kuwait
# IL Israel, QA Qatar, OM Oman, BH Bahrain, AZ Azerbaijan, SY Syrian Arab Republic (the), JO Jordan, GE Georgia
# PS Palestine, State of, AM Armenia, LB Lebanon, YE Yemen
# Ember demand 1948 TWh (6.30 % of the world). Out of the box like the archetype runs, except:
#   - clustering.alternative_clustering + gadm_layer_id 0 (native pypsa-earth): build_bus_regions keeps one onshore region per
#     GADM country shape, so renewable profiles, plants and load are per country, and cluster_network maps every AC bus
#     of a country onto one bus (busmap gadm_0_AC). Islands and isolated OSM fragments are lumped into that node.
#   - threshold_voltage 100 kV (archetypes: 200 kV): the grid is collapsed anyway, and several small systems have no
#     >= 200 kV substation in OSM; every country needs at least one bus.
#   - catalyst.extra_opts ATKc (merge_config.py adds it to the overlay opts): prepare_network removes every cross-border
#     line / link, so no country trades with its neighbours.
#   - load_options.fallback_source demcast (fork patch): countries without GEGIS load take DemandCast 2013 (PS)
#   - renewable.<tech>.excluder_resolution 1000 m (fork patch; default 100 m): atlite rasterises each region's exclusion
#     mask over its bounding box, which at 100 m does not fit memory for country-sized regions (Argentina: OOM at 12 GB)
# Cutout: cutout-2013-era5-westasia (pypsa-earth prebuilt); clip_bbox [24.9, 8.4, 63.9, 44.1], so overseas islands outside it are ignored.

countries: ["AE", "AM", "AZ", "BH", "GE", "IL", "IQ", "IR", "JO", "KW", "LB", "OM", "PS", "QA", "SA", "SY", "TR", "YE"]   # quoted: YAML 1.1 reads NO (Norway) as false

run:
  name: MEA
  shared_cutouts: true

scenario:
  simpl: [""]
  clusters: [18]          # one per country (the GADM busmap ignores the number; it only names the files)
  ll: [copt]
  opts: [Co2L]

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: left

enable:
  retrieve_databundle: true
  retrieve_cost_data: true
  retrieve_cutout: false
  build_cutout: false     # cutouts/cutout-2013-era5-westasia.nc: hardlink made by prestage.sh
  download_osm_data: true
  build_natura_raster: false
  progress_bar: false

download_osm_data_nprocesses: 1

osm:
  clean_osm_data:
    threshold_voltage: 100000

atlite:
  nprocesses: 1
  default: cutout-2013-era5-westasia
  cutouts:
    cutout-2013-era5-westasia:
      module: era5
      dx: 0.3
      dy: 0.3
      x: [24.9, 63.9]
      y: [8.4, 44.1]

load_options:
  fallback_source: demcast

electricity:
  renewable_carriers: [solar, onwind, offwind-ac, offwind-dc, hydro]

renewable:
  onwind:
    excluder_resolution: 1000
  offwind-ac:
    excluder_resolution: 1000
  offwind-dc:
    excluder_resolution: 1000
  solar:
    excluder_resolution: 1000

build_shape_options:
  nprocesses: 1
  gdp_method: standard
  gadm_layer_id: 0
  clip_bbox: [24.9, 8.4, 63.9, 44.1]

clustering:                          # (the archetype configs use the deprecated alias cluster_options; one block here)
  alternative_clustering: true
  simplify_network:
    p_threshold_drop_isolated: false   # default 20 MW would drop unpopulated buses together with their plants

solving:
  solver:
    name: gurobi

catalyst:
  single_node: true
  extra_opts: ATKc
