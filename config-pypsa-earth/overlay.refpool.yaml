#
# Reference pathway (SOW §1.3 S1, no 24/7 CFE buyers) with the learning rule of overlay.cfepool.yaml: one pathway over
# all modelled regions (`run.sh pathway:refpool:JP,IN1,NZ,ZA,MA`), their joint builds extrapolated to the rest of the
# world, the resulting costs applied to every region. Own market results/learning/refpool/. Same rule as cfepool so
# that the difference between the two is the buyers alone (overlay.ref.yaml counts only the modelled builds).
inherit: ref

catalyst:
  learning_spillover: extrapolate
