#
# Catalyst / WP1: contiguous-US (CONUS) power-only prenetwork, STAGE B (full weather year 2013).
# Diff over pypsa-earth config.default.yaml; copied to models/pypsa-earth/config.yaml
# by config-pypsa-earth/run_us.sh after the smoke stage succeeded. Reuses data/ (bundles, OSM, GADM).
# Stage A (config.US-smoke.yaml) is identical except run name, snapshots and cutout name.

countries: [US]

run:
  name: US
  shared_cutouts: true

scenario:
  simpl: [""]            # empty: simplify_network skips its pre-clustering (no solver call)
  clusters: [50]
  ll: [copt]
  opts: [Co2L]

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: left

enable:
  retrieve_databundle: true
  retrieve_cost_data: true
  retrieve_cutout: false  # prebuilt North-America cutout is 29.5 GB zipped; build a CONUS one instead
  build_cutout: true      # needs ~/.cdsapirc; bounds fixed below, time = snapshots
  download_osm_data: true
  build_natura_raster: false
  progress_bar: false

download_osm_data_nprocesses: 1   # fork patch: earth-osm single process

osm:
  clean_osm_data:
    threshold_voltage: 200000   # [V] keep the 230 kV+ backbone (61k lines, 5.6k buses); at the 51 kV default the US has
                                # 30k buses and the per-bus availability matrices in build_renewable_profiles exceed 8 GB

atlite:
  nprocesses: 1
  default: cutout-2013-era5-conus
  cutouts:
    cutout-2013-era5-conus:
      module: era5
      dx: 0.3
      dy: 0.3
      x: [-125.0, -66.5]   # CONUS; auto-bounds would span the globe because of Alaska/Hawaii
      y: [24.0, 50.0]

electricity:
  renewable_carriers: [solar, onwind, offwind-ac, offwind-dc, hydro]

build_shape_options:
  nprocesses: 1
  gdp_method: standard    # GDP_PPP raster ships in bundle_data_earth (data/GDP); used with population to distribute demand to buses
  clip_bbox: [-125.0, 24.0, -66.5, 50.0]   # fork patch: drop Alaska, Hawaii, Pacific EEZ

solving:
  solver:
    name: gurobi          # only cluster_network's MIQP uses it before prepare_network; scip is the fallback
