#
# Catalyst / WP1: Brazil power-only prenetwork, STAGE B (full weather year 2013).
# Diff over pypsa-earth config.default.yaml; copied to models/pypsa-earth/config.yaml
# by config-pypsa-earth/run.sh after the smoke stage succeeded. Reuses data/ (bundles, OSM, GADM).
# Stage A (config.BR-smoke.yaml) is identical except run name, snapshots, cutout name and gdp_method.

countries: [BR]

run:
  name: BR
  shared_cutouts: true

scenario:
  simpl: [""]            # empty: simplify_network skips its pre-clustering (no solver call)
  clusters: [50]
  ll: [copt]
  opts: [Co2L]

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: left

enable:
  retrieve_databundle: true
  retrieve_cost_data: true
  retrieve_cutout: false  # no prebuilt cutout; build a Brazil one via CDS
  build_cutout: true      # needs ~/.cdsapirc; bounds fixed below, time = snapshots; run.sh flips it off once the file exists
  download_osm_data: true
  build_natura_raster: false
  progress_bar: false

download_osm_data_nprocesses: 1   # fork patch: earth-osm single process

osm:
  clean_osm_data:
    threshold_voltage: 200000   # [V] >= 230 kV = ONS "Rede Básica" (the transmission system proper); same as the US run.
                                # 138 kV subtransmission is left out; it would roughly triple the base buses.
    drop_duplicate_ids: true      # a cross-border way arrives once per country extract and became parallel lines
    fix_indirect_circuits: true   # voltage=230000;230000, cables=6 became 3 circuits per voltage instead of 1
  build_osm_network:
    geodesic_length: true         # Web Mercator stretches lengths by 1 / cos(latitude)

load_options:
  # build_demand_profiles: Brazil's demand is split over its states with their shares of the consumption of 2024
  # (EPE yearbook; data/demand_provinces/br_states_2024.csv) through the table
  # demand_shares.csv = calibration/2024/demand_shares.csv (scripts/build_demand_shares.py) instead of 0.6 x GDP +
  # 0.4 x population; the same shares for every horizon. README "Demand placement"; REFACTOR_LATER.md item J
  subnational_shares: true

links:
  dc_projects:                    # HVDC capacity per project, README "Grid corrections"; overrides dc_ratings of statistics.yaml
    enable: true                  # table dc_projects.csv = data/hvdc/hvdc_project_table.csv (tables.smk)
    reference_year: 2024          # the calibration year; myopic horizons would need the table's years per horizon
    unmatched: zero               # links without a project: unnamed pieces of lines added separately, later lines, links outside the table
    add_missing: true             # BritNed, COBRA, Kontek, Baihetan-Jiangsu, ...: in service, but not routable in OSM

atlite:
  nprocesses: 1
  default: cutout-2013-era5-brazil
  cutouts:
    cutout-2013-era5-brazil:
      module: era5
      dx: 0.3
      dy: 0.3
      x: [-74.5, -31.0]    # mainland Brazil + Fernando de Noronha; the EEZ lobes around Trindade and
      y: [-34.5, 6.0]      # St Peter & Paul (to 26°W) are clipped away (no offshore wind out there)

electricity:
  renewable_carriers: [solar, onwind, offwind-ac, offwind-dc, hydro]

build_shape_options:
  nprocesses: 1
  gdp_method: standard    # GDP_PPP raster ships in bundle_data_earth (data/GDP); used with population to distribute demand to buses
  clip_bbox: [-74.5, -34.5, -31.0, 6.0]   # fork patch: same box as the cutout; drops the far-offshore EEZ islands

solving:
  solver:
    name: gurobi          # only cluster_network's MIQP uses it before prepare_network; scip is the fallback

catalyst:
  cfe:
    zones: statistics             # 24/7 CFE buyers are matched per market zone, not per country: the four submarkets
                                  # (data/market_zones/market_zones.csv -> statistics/market_zones.csv, tables.smk; README "Market zones")
