# GENERATED by config-pypsa-earth/scripts/select_countries.py - edit the script, not this file.
# Catalyst / rest of world, group ASI (East, South-East, South and Central Asia): 25 countries, each ONE NODE and islanded, power-only, weather year 2013.
# JP Japan, KR South Korea, ID Indonesia, VN Viet Nam, TW Taiwan, TH Thailand, MY Malaysia, PK Pakistan
# PH Philippines (the), KZ Kazakhstan, BD Bangladesh, UZ Uzbekistan
# KP Korea (the Democratic People's Republic of), TM Turkmenistan, MM Myanmar, KH Cambodia, TJ Tajikistan
# KG Kyrgyzstan, LK Sri Lanka, LA Lao People's Democratic Republic (the), BT Bhutan, MN Mongolia, NP Nepal
# AF Afghanistan, BN Brunei Darussalam
# Ember demand 3850 TWh (12.45 % of the world). Out of the box like the archetype runs, except:
#   - clustering.alternative_clustering + gadm_layer_id 0 (native pypsa-earth): build_bus_regions keeps one onshore region per
#     GADM country shape, so renewable profiles, plants and load are per country, and cluster_network maps every AC bus
#     of a country onto one bus (busmap gadm_0_AC). Islands and isolated OSM fragments are lumped into that node.
#   - threshold_voltage 100 kV (archetypes: 200 kV): the grid is collapsed anyway, and several small systems have no
#     >= 200 kV substation in OSM; every country needs at least one bus.
#   - catalyst.extra_opts ATKc (merge_config.py adds it to the overlay opts): prepare_network removes every cross-border
#     line / link, so no country trades with its neighbours.
#   - load_options.fallback_source demcast (fork patch): countries without GEGIS load take DemandCast 2013 (AF, BT, LA)
#   - renewable.<tech>.excluder_resolution 1000 m (fork patch; default 100 m): atlite rasterises each region's exclusion
#     mask over its bounding box, which at 100 m does not fit memory for country-sized regions (Argentina: OOM at 12 GB)
# Cutout: cutout-2013-era5-asia (pypsa-earth prebuilt); clip_bbox [24.9, -14.4, 158.1, 55.8], so overseas islands outside it are ignored.

countries: ["AF", "BD", "BN", "BT", "ID", "JP", "KG", "KH", "KP", "KR", "KZ", "LA", "LK", "MM", "MN", "MY", "NP", "PH", "PK", "TH", "TJ", "TM", "TW", "UZ", "VN"]   # quoted: YAML 1.1 reads NO (Norway) as false

run:
  name: ASI
  shared_cutouts: true

scenario:
  simpl: [""]
  clusters: [25]          # one per country (the GADM busmap ignores the number; it only names the files)
  ll: [copt]
  opts: [Co2L]

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: left

enable:
  retrieve_databundle: true
  retrieve_cost_data: true
  retrieve_cutout: false
  build_cutout: false     # cutouts/cutout-2013-era5-asia.nc: hardlink made by prestage.sh
  download_osm_data: true
  build_natura_raster: false
  progress_bar: false

download_osm_data_nprocesses: 1

osm:
  clean_osm_data:
    threshold_voltage: 100000

atlite:
  nprocesses: 1
  default: cutout-2013-era5-asia
  cutouts:
    cutout-2013-era5-asia:
      module: era5
      dx: 0.3
      dy: 0.3
      x: [24.9, 158.1]
      y: [-14.4, 55.8]

load_options:
  fallback_source: demcast

electricity:
  renewable_carriers: [solar, onwind, offwind-ac, offwind-dc, hydro]

renewable:
  onwind:
    excluder_resolution: 1000
  offwind-ac:
    excluder_resolution: 1000
  offwind-dc:
    excluder_resolution: 1000
  solar:
    excluder_resolution: 1000

build_shape_options:
  nprocesses: 1
  gdp_method: standard
  gadm_layer_id: 0
  clip_bbox: [24.9, -14.4, 158.1, 55.8]

clustering:                          # (the archetype configs use the deprecated alias cluster_options; one block here)
  alternative_clustering: true
  simplify_network:
    p_threshold_drop_isolated: false   # default 20 MW would drop unpopulated buses together with their plants

solving:
  solver:
    name: gurobi

catalyst:
  single_node: true
  extra_opts: ATKc
