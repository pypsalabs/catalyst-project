#
# Learning sensitivity of the 24/7 CFE pathway (overlay.cfe.yaml, inherited): shares every horizon up to 2030 with
# stage <R>-cfe and continues from its solved 2030 network with its own learning market results/learning/cfemid/.
# What the rest of the world builds of the technologies the modelled regions build (clear_market.py,
# catalyst.learning_spillover; share = the stages' share of 2024 world demand):
#   midpoint: modelled builds x sqrt(1 / share of world demand), the geometric middle of the two extremes
inherit: cfe

catalyst:
  branch: {from: cfe, year: 2030}
  learning_spillover: midpoint     # what the unmodelled rest of the world builds of the advanced technologies the modelled regions build:
                                   # clear_market.py multiplies the modelled builds by m before they enter Wright's law (cumulative capacity),
                                   # share = the modelled regions' share of 2024 world demand (JP 3.29 %); values:
                                   #   1 (or unset)  secluded: only the modelled builds count                              (JP x1)
                                   #   midpoint      m = sqrt(1/share), the geometric middle of the two extremes           (JP x5.5)  <- this overlay
                                   #   extrapolate   m = 1/share: the rest of the world builds as much per MWh of demand   (JP x30.4)
                                   #   <number>      m as given, e.g. 2
                                   # exogenous deployment (LEARNING_EXOGENOUS) is not scaled; all stages of one market need the same value
