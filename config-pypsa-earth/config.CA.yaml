# GENERATED by config-pypsa-earth/scripts/select_countries.py - edit the script, not this file.
# Catalyst / rest of world, group CA (Canada): 1 country, each ONE NODE and islanded, power-only, weather year 2013.
# CA Canada
# Ember demand 624 TWh (2.02 % of the world). Out of the box like the archetype runs, except:
#   - one country too large for a whole-country region (atlite reads the 100 m land-cover raster over the region's bounding
#     box at native resolution: 3-6e9 pixels), so the archetype recipe: Voronoi regions per base bus at 200 kV, every
#     isolated sub-network fetched into the backbone (s_threshold_fetch_isolated 1.0: below 100 % of the national load),
#     then clusters 1 (like SG).
#   - crs.area_crs EPSG:6933 (cylindrical equal area; default Mollweide ESRI:54009): atlite pads each region's exclusion
#     raster from its bounding-box corner, and for wide high-latitude Voronoi cells that corner lies outside the Mollweide
#     ellipse -> NaN transform (CA: 4 of 1145 regions, build_renewable_profiles failed).
#   - catalyst.extra_opts ATKc (merge_config.py adds it to the overlay opts): prepare_network removes every cross-border
#     line / link, so no country trades with its neighbours.
#   - load_options.fallback_source demcast (fork patch): countries without GEGIS load take DemandCast 2013 (none in this group)
#   - renewable.<tech>.excluder_resolution 1000 m (fork patch; default 100 m): atlite rasterises each region's exclusion
#     mask over its bounding box, which at 100 m does not fit memory for country-sized regions (Argentina: OOM at 12 GB)
# Cutout: cutout-2013-era5-northamerica (pypsa-earth prebuilt); clip_bbox [-141.5, 41.5, -52.0, 73.8], so overseas islands outside it are ignored.

countries: ["CA"]   # quoted: YAML 1.1 reads NO (Norway) as false

run:
  name: CA
  shared_cutouts: true

scenario:
  simpl: [""]
  clusters: [1]
  ll: [copt]
  opts: [Co2L]

crs:
  area_crs: EPSG:6933

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: left

enable:
  retrieve_databundle: true
  retrieve_cost_data: true
  retrieve_cutout: false
  build_cutout: false     # cutouts/cutout-2013-era5-northamerica.nc: hardlink made by prestage.sh
  download_osm_data: true
  build_natura_raster: false
  progress_bar: false

download_osm_data_nprocesses: 1

osm:
  clean_osm_data:
    threshold_voltage: 200000

atlite:
  nprocesses: 1
  default: cutout-2013-era5-northamerica
  cutouts:
    cutout-2013-era5-northamerica:
      module: era5
      dx: 0.3
      dy: 0.3
      x: [-171.9, -47.1]
      y: [1.5, 73.8]

load_options:
  fallback_source: demcast

electricity:
  renewable_carriers: [solar, onwind, offwind-ac, offwind-dc, hydro]

renewable:
  onwind:
    excluder_resolution: 1000
  offwind-ac:
    excluder_resolution: 1000
  offwind-dc:
    excluder_resolution: 1000
  solar:
    excluder_resolution: 1000

build_shape_options:
  nprocesses: 1
  gdp_method: standard
  clip_bbox: [-141.5, 41.5, -52.0, 73.8]

clustering:
  simplify_network:
    p_threshold_drop_isolated: false   # keep isolated buses and their plants ...
    s_threshold_fetch_isolated: 1.0    # ... and fetch every isolated sub-network into the backbone: one sub-network, one cluster

solving:
  solver:
    name: gurobi

catalyst:
  single_node: true
  extra_opts: ATKc
