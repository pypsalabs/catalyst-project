#
# Catalyst / WP1: US East (Eastern Interconnection and ERCOT) as its own model region (2026-11-17; README "US West /
# US East"). The contiguous US was one
# stage `US` until then; the two halves are coupled by about 1.3 GW of back-to-back ties only, none of them in the OSM
# network, so they are modelled apart and meet only in the learning market. US East is the fossil-heavy brownfield
# archetype.
#
# The region is a list of whole states (statistics are by state): AL AR CT DE DC FL GA IL IN IA KS KY LA ME MD MA MI
# MN MS MO NE NH NJ NY NC ND OH OK PA RI SC SD TN TX VT VA WV WI.
# Texas is part of it: ERCOT is not modelled apart and is connected to the East by whatever lines OSM shows.
# The country stays `US` in every data source (GADM, OSM, powerplantmatching, demand series); what makes this the
# East is
#   - build_shape_options: gadm_subset + clip_bbox  the land is the listed states, the sea the part of the US EEZ in the box
#                                                    (OSM network, bus regions, wind / solar potential and EGS supply
#                                                    curves follow the shapes)
#   - electricity: powerplants_within_shapes         plants more than 10 km outside the shapes are dropped
#   - catalyst: tables: region                       the statistics of the half replace the national rows (tables.smk;
#                                                    calibration/<year>/regions/USE/, scripts/build_calibration.py)
# The state list below is the single source of the split: build_calibration.py reads it for the tables.
# No hourly demand shape per half yet: both use the national series (REFACTOR_LATER.md item E).

countries: [US]

run:
  name: USE
  shared_cutouts: true

scenario:
  simpl: [""]            # empty: simplify_network skips its pre-clustering (no solver call)
  clusters: [30]         # USW 20 + USE 30 = the 50 nodes of the former US stage; a tractability setting
  ll: [copt]
  opts: [Co2L]

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: left

enable:
  retrieve_databundle: true
  retrieve_cost_data: true
  retrieve_cutout: false  # prebuilt North-America cutout is 29.5 GB zipped; the CONUS one is used instead
  build_cutout: false     # cutouts/cutout-2013-era5-conus.nc exists (built via CDS for the former US stage, shared by both halves)
  download_osm_data: true
  build_natura_raster: false
  progress_bar: false

download_osm_data_nprocesses: 1   # fork patch: earth-osm single process

osm:
  clean_osm_data:
    threshold_voltage: 200000   # [V] keep the 230 kV+ backbone; at the 51 kV default the US has 30k buses and the
                                # per-bus availability matrices in build_renewable_profiles exceed 8 GB
    drop_duplicate_ids: true      # a cross-border way arrives once per country extract and became parallel lines
    fix_indirect_circuits: true   # voltage=230000;230000, cables=6 became 3 circuits per voltage instead of 1
  build_osm_network:
    geodesic_length: true         # Web Mercator stretches lengths by 1 / cos(latitude)

links:
  dc_projects:                    # HVDC capacity per project, README "Grid corrections"; overrides dc_ratings of statistics.yaml
    enable: true                  # table dc_projects.csv = data/hvdc/hvdc_project_table.csv (tables.smk)
    reference_year: 2024          # the calibration year; myopic horizons would need the table's years per horizon
    unmatched: zero               # links without a project: unnamed pieces of lines added separately, later lines, links outside the table
    add_missing: true             # only projects with both terminals inside the half get a link

atlite:
  nprocesses: 1
  default: cutout-2013-era5-conus
  cutouts:
    cutout-2013-era5-conus:
      module: era5
      dx: 0.3
      dy: 0.3
      x: [-125.0, -66.5]   # CONUS; auto-bounds would span the globe because of Alaska/Hawaii
      y: [24.0, 50.0]

electricity:
  renewable_carriers: [solar, onwind, offwind-ac, offwind-dc, hydro]
  powerplants_within_shapes: 10     # fork option: plants more than 10 km outside the shapes are dropped; without it every
                                    # US plant is assigned to its nearest bus of this half. 10 km keeps the plants on
                                    # barrier islands, which the simplified shapes leave out (St. Lucie, 1.9 GW)

build_shape_options:
  nprocesses: 1
  gdp_method: standard    # GDP_PPP raster ships in bundle_data_earth (data/GDP); used with population to distribute demand to buses
  # fork option: GADM level-1 ids (GADM numbers the states alphabetically, Alaska = 2 and Hawaii = 12 included)
  gadm_subset: [US.1_1, US.4_1, US.7_1, US.8_1, US.9_1, US.10_1, US.11_1, US.14_1,
                US.15_1, US.16_1, US.17_1, US.18_1, US.19_1, US.20_1, US.21_1, US.22_1,
                US.23_1, US.24_1, US.25_1, US.26_1, US.28_1, US.30_1, US.31_1, US.33_1,
                US.34_1, US.35_1, US.36_1, US.37_1, US.39_1, US.40_1, US.41_1, US.42_1,
                US.43_1, US.44_1, US.46_1, US.47_1, US.49_1, US.50_1]
  clip_bbox: [-107.0, 24.0, -66.5, 50.0]    # the 37 states + DC, the Gulf and the Atlantic EEZ (no Pacific east of 117 W)

catalyst:
  tables:
    region: USE           # tables.smk: rows of calibration/<year>/regions/USE/<table>.csv replace the national US rows

solving:
  solver:
    name: gurobi          # only cluster_network's MIQP uses it before prepare_network; scip is the fallback
