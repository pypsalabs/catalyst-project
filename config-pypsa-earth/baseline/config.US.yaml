# SPDX-License-Identifier: CC0-1.0
#
# The contiguous US as ONE region, the stage `US` of the project until 2026-11-17. Since then the US is modelled as US West
# and US East (../config.USW.yaml, ../config.USE.yaml; README "US West / US East"). This file stays for
#   - the v0.9.0 baseline (run_overnight.sh, CATALYST_BASELINE=1), which has no fork option to model a part of a country
#     (merge_config.py and run.sh look here first in baseline mode);
#   - the read-only checks and model-doc figures that still read the files of the former US runs on disk
#     (scripts/check_fleet.py, check_renewables.py), until the two halves are built.
# It is not a stage of the patched fork: run.sh does not find it, and the pages and the learning market do not count it.

countries: [US]

run:
  name: US
  shared_cutouts: true

scenario:
  simpl: [""]            # empty: simplify_network skips its pre-clustering (no solver call)
  clusters: [50]
  ll: [copt]
  opts: [Co2L]

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: left

enable:
  retrieve_databundle: true
  retrieve_cost_data: true
  retrieve_cutout: false  # prebuilt North-America cutout is 29.5 GB zipped; build a CONUS one instead
  build_cutout: true      # needs ~/.cdsapirc; bounds fixed below, time = snapshots
  download_osm_data: true
  build_natura_raster: false
  progress_bar: false

download_osm_data_nprocesses: 1   # fork patch: earth-osm single process

osm:
  clean_osm_data:
    threshold_voltage: 200000   # [V] keep the 230 kV+ backbone (61k lines, 5.6k buses); at the 51 kV default the US has
                                # 30k buses and the per-bus availability matrices in build_renewable_profiles exceed 8 GB
    drop_duplicate_ids: true      # a cross-border way arrives once per country extract and became parallel lines
    fix_indirect_circuits: true   # voltage=230000;230000, cables=6 became 3 circuits per voltage instead of 1
  build_osm_network:
    geodesic_length: true         # Web Mercator stretches lengths by 1 / cos(latitude)

links:
  dc_projects:                    # HVDC capacity per project, README "Grid corrections"; overrides dc_ratings of statistics.yaml
    enable: true                  # table dc_projects.csv = data/hvdc/hvdc_project_table.csv (tables.smk)
    reference_year: 2024          # the calibration year; myopic horizons would need the table's years per horizon
    unmatched: zero               # links without a project: unnamed pieces of lines added separately, later lines, links outside the table
    add_missing: true             # BritNed, COBRA, Kontek, Baihetan-Jiangsu, ...: in service, but not routable in OSM

atlite:
  nprocesses: 1
  default: cutout-2013-era5-conus
  cutouts:
    cutout-2013-era5-conus:
      module: era5
      dx: 0.3
      dy: 0.3
      x: [-125.0, -66.5]   # CONUS; auto-bounds would span the globe because of Alaska/Hawaii
      y: [24.0, 50.0]

electricity:
  renewable_carriers: [solar, onwind, offwind-ac, offwind-dc, hydro]

build_shape_options:
  nprocesses: 1
  gdp_method: standard    # GDP_PPP raster ships in bundle_data_earth (data/GDP); used with population to distribute demand to buses
  clip_bbox: [-125.0, 24.0, -66.5, 50.0]   # fork patch: drop Alaska, Hawaii, Pacific EEZ

solving:
  solver:
    name: gurobi          # only cluster_network's MIQP uses it before prepare_network; scip is the fallback
