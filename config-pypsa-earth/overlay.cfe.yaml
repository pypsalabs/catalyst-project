#
# Catalyst scenario "cfe" (SOW §1.3 S2, 24/7 CFE catalyst) = the myopic pathway (overlay.myopic.yaml, inherited) with a
# 24/7 carbon-free electricity buyer at every AC bus from the first expansion horizon on: a flat load of `share` of the
# bus's demand; the buyers of a market zone are matched together with carbon-free supply in every hour (Riepin et al., Joule
# 2025, github.com/PyPSA/247-cfe), choosing what to procure from the palette itself (technology choice and volume
# endogenous, SOW §1.1). Implementation: fork scripts/cfe.py (buyer added in add_brownfield, constraints in
# solve_network); README "24/7 CFE catalyst (overlay cfe)". Own learning market results/learning/cfe/.
# Decided 2026-11-08 (share: 2026-11-10, see below): 100 % CFE, exports at most 20 % of the buyer's load (247-procurement-paper).
inherit: myopic

catalyst:
  # since 2026-11-25: the buyers are added per horizon (fork add_brownfield), so everything up to the prepared network
  # is the reference's. <R>-cfe starts from a copy of the prepared inputs of <R>-ref (plant list, profiles, network;
  # run.sh copy_parent) where that stage exists, and builds its own otherwise
  inputs_from: ref
  cfe:
    share: statistics           # decided 2026-11-19: the buyers' share of demand per country and horizon, from the table
                                # calibration/<year>/cfe_share.csv = data centres + half of the other electricity use of
                                # RE100 members, at most 20 % (evidence and builder: misc-quarter1/datacentre-demand;
                                # model doc "Demand for 24/7 Carbon-Free Electricity"); every horizon adds a cohort that
                                # buys at that horizon's costs. Before: {2030: 0.01, 2050: 0.10} in every country (a
                                # number or such a pathway still works)
    target: 1.0                 # only binds with grid_imports: true (without imports the score is 1 by construction)
    excess_share: 0.20
    start_year: 2030            # first horizon with buyers (= the first planning horizon since 2026-11-25)
    matching: zone              # decided (Morocco ten-node test of 2026-11-11, written down 2026-11-18): the buyers of a
                                # market zone are matched together hour by hour, power through the grid. Matching every
                                # buyer at its own node (overlay cfenode) is unrealistically restrictive: 24/7 CFE
                                # accounting matches within a bidding zone. Also the fork's default since 2026-11-18.
                                # The zone of a bus is its country, or its market zone where the region's config sets
                                # catalyst: cfe: zones: statistics (BR, CN, NWE, USW, USE; README "Market zones")
    grid_imports: false         # decided 2026-11-10: the buyer never buys from the grid, its own portfolio covers every
                                # hour (import link closed, no matching constraint needed, one solve per horizon);
                                # true = 247-cfe: imports credited with the grid's hourly clean share, `iterations` solves
    iterations: 2               # only with grid_imports: true: solves per horizon; each takes the grid CFE of the one before (247-cfe)
    # what the buyer may procure (twins of the bus's extendable assets of these carriers) and the clean carriers
    # of the grid CFE; sofc-cc counts as clean (2.2 % of the gas CO2 left, ASSUMPTION as in the toy model)
    clean_carriers: [solar, onwind, offwind-ac, offwind-dc, egs, nuclear-gen4, sofc-cc, iron-air, vrfb, co2-battery, battery]
    clean_threshold: 0.01       # tCO2/MWh_th: other grid carriers at or below count as clean (biomass, hydro, nuclear)
