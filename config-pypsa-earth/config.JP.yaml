# SPDX-License-Identifier: CC0-1.0
#
# Catalyst / test region JP (Japan), ONE NODE, power-only, weather year 2013. Hand-written from config.ASI.yaml
# (select_countries.py template), 2026-11-08: the standalone test region of the learning pipeline (24/7 CFE overlay
# `cfe` and its learning branches, README "24/7 CFE catalyst"). Japan stays in the ASI group as well, so:
#   - catalyst.world_page: false keeps JP off the world page (plot_world.py), where ASI already counts it;
#   - never put JP and ASI into one learning market (Japan's builds would count twice).
# Ember demand 1016 TWh (3.29 % of the world). Same settings as ASI (100 kV, GADM level 0 + alternative clustering,
# excluder 1000 m, ATKc), the Asia cutout cropped by clip_bbox to Japan's box (incl. Yonaguni, Minamitorishima).
# Japan's 50 Hz / 60 Hz split does not matter at one node.

countries: ["JP"]

run:
  name: JP
  shared_cutouts: true

scenario:
  simpl: [""]
  clusters: [1]
  ll: [copt]
  opts: [Co2L]

snapshots:
  start: "2013-01-01"
  end: "2014-01-01"
  inclusive: left

enable:
  retrieve_databundle: true
  retrieve_cost_data: true
  retrieve_cutout: false
  build_cutout: false     # cutouts/cutout-2013-era5-asia.nc: hardlink made by prestage.sh
  download_osm_data: true
  build_natura_raster: false
  progress_bar: false

download_osm_data_nprocesses: 1

osm:
  clean_osm_data:
    threshold_voltage: 100000

atlite:
  nprocesses: 1
  default: cutout-2013-era5-asia
  cutouts:
    cutout-2013-era5-asia:
      module: era5
      dx: 0.3
      dy: 0.3
      x: [24.9, 158.1]
      y: [-14.4, 55.8]

load_options:
  fallback_source: demcast

electricity:
  renewable_carriers: [solar, onwind, offwind-ac, offwind-dc, hydro]

renewable:
  onwind:
    excluder_resolution: 1000
  offwind-ac:
    excluder_resolution: 1000
  offwind-dc:
    excluder_resolution: 1000
  solar:
    excluder_resolution: 1000

build_shape_options:
  nprocesses: 1
  gdp_method: standard
  gadm_layer_id: 0
  clip_bbox: [122.5, 20.0, 154.5, 46.0]

clustering:
  alternative_clustering: true
  simplify_network:
    p_threshold_drop_isolated: false

solving:
  solver:
    name: gurobi

catalyst:
  single_node: true
  extra_opts: ATKc
  world_page: false
