#
# 24/7 CFE trunk (overlay cfe) to 2050 WITHOUT resource classes (one onshore-wind and one solar generator per
# region, as before 2026-11-12), with its own learning market results/learning/cfenorc/ (secluded learning). The A/B
# partner of the classes, which are on by default since 2026-11-12 (statistics.yaml; README "Resource classes").
inherit: cfe

catalyst:
  inputs_from: refnorc   # prepared inputs of the reference without resource classes (overlay cfe: from ref)

renewable:
  onwind:
    resource_classes: 1   # 1 = off: no class rules in the DAG
  solar:
    resource_classes: 1
