    };
    const setRule = (id) => {
      if (curRule === id) return;
      clear(); curRule = id;
      if (id == null) return;
      for (const el of root.querySelectorAll('.r-node[data-rule="' + id + '"], .m-card[data-rule="' + id + '"]')) el.classList.add('hi');
    };
    root.addEventListener('mousemove', e => {
      const t = e.target.closest('[data-r], [data-f], [data-rule]');
      if (!t || !rlEx) { clear(); hideTip(); root.removeAttribute('data-hf'); return; }
      const F = rlEx.features, fi = t.dataset.f != null ? +t.dataset.f : null, ri = t.dataset.r != null ? +t.dataset.r : null;
      if (fi != null) root.setAttribute('data-hf', fi); else root.removeAttribute('data-hf');
      const def = LAYERS.find(l => l.id === rlFor.split('|')[0]);
      let html;
      if (ri == null && fi != null) {
        const f = F[fi];
        html = '<b>' + esc(f.label) + '</b> <span class="k">' + esc(f.unit) + '</span><div>' + esc(f.desc) + '</div>';
        setPath(null);
      } else if (ri == null) {
        const ru = rlEx.rules.find(x => x.id === t.dataset.rule);
        if (!ru) { clear(); hideTip(); return; }
        const decided = rlEx.rows.filter(r => r.rule === ru.id).sort((p, q) => q.demand_twh - p.demand_twh);
        html = '<b>' + esc(ru.id) + ' · ' + esc(ru.title) + '</b><div>' + esc(ru.cond) + '</div><div class="k" style="margin-top:3px">' + esc(ru.note) + '</div>';
        html += '<div style="margin-top:5px"><b>' + decided.length + ' grids decided here</b>' + (decided.length ? ': ' + esc(decided.slice(0, 14).map(r => shortName(r.name)).join(', ')) + (decided.length > 14 ? ', …' : '') : '') + '</div>';
        setRule(ru.id);
      } else {
        const r = rlEx.rows[ri], a = archOf(def, r.archetype);
        html = '<b>' + esc(r.name) + '</b> <span class="k">' + esc(r.iso3) + '</span><div><span style="color:' + a.color + '">●</span> ' + esc(a.name) + ' · proximity ' + r.proximity.toFixed(2) + ' · ' + fmtTwh(r.demand_twh) + ' today</div>';
        html += '<div class="path">' + r.path.map(st => '<div class="' + (st.pass ? 'yes' : 'no') + '"><span class="r">' + esc(st.rule) + '</span><span>' + (st.pass ? '✓ ' : '✗ ') + esc(st.why) + '</span></div>').join('') + '</div>';
        if (fi != null) html += '<div style="margin-top:4px">' + esc(F[fi].desc) + '</div>';
        html += '<table>' + F.map((f, i) => '<tr' + (i === fi ? ' class="on"' : '') + '><td>' + swatch(RULE_COLORS[i]) + esc(f.label) + '</td><td class="v">' + esc(r.disp[i]) + '</td></tr>').join('') + '</table>';
        html += '<div class="k" style="margin-top:4px">scores: ' + Object.entries(r.scores).map(([k, v]) => esc(k) + ' ' + v.toFixed(2)).join(' · ') + '</div>';
        setPath(ri);
      }
      showTip(e, html);
    });
    root.addEventListener('mouseleave', () => { clear(); hideTip(); root.removeAttribute('data-hf'); });
  })();

  function renderPanel() {
    const st = state;
    for (const b of $('tabs').children) b.classList.toggle('on', b.dataset.tab === st.tab);
    $('legendBody').hidden = !st.panelOpen || st.tab !== 'legend';
    $('tabs').hidden = !st.panelOpen;
    $('kmeans').hidden = st.tab !== 'kmeans';
    $('rules').hidden = st.tab !== 'rules';
    if (st.tab === 'legend') renderLegendTab();
    if (st.tab === 'kmeans') renderKmeansTab();
    if (st.tab === 'rules') renderRulesTab();
    $('toggle').textContent = st.panelOpen ? '–' : '+';
    $('toggle').setAttribute('aria-label', st.panelOpen ? 'Collapse panel' : 'Expand panel');

    const loadingMsg = st.loading ? 'Loading coastlines…' : (st.popLoading ? 'Decoding population grid…' : '');
    $('loading').textContent = loadingMsg;
    $('loading').hidden = !loadingMsg;
    $('err').hidden = !st.err;
  }

  for (const b of $('tabs').children) b.addEventListener('click', () => { state.tab = b.dataset.tab; renderPanel(); });
  $('toggle').addEventListener('click', () => { state.panelOpen = !state.panelOpen; renderPanel(); });
  renderPanel();

  // ?memprobe=1: after 25 s write JS heap use into the document title (headless measurement aid)
  if (qs.has('memprobe')) setTimeout(() => {
    const m = performance.memory || {};
    document.title = 'MEM ' + JSON.stringify({ usedMB: Math.round((m.usedJSHeapSize || 0) / 1048576), totalMB: Math.round((m.totalJSHeapSize || 0) / 1048576) });
  }, 25000);
  const wait = () => { if (window.L) initMap(); else setTimeout(wait, 60); };
  wait();
  loadMask();
  loadPopulation();
})();
</script>
</body>
</html>
