# Configuration for the 2025 techno-economic baseline workflow (misc-quarter1/technology-costs).
#
# All monetary values are normalised to `base_currency` of `base_currency_year`:
#   value_base = value * fx_eur_per_unit[cur][y] / fx_eur_per_unit[base][y]
#                      * cpi[base][base_year] / cpi[base][y]
# i.e. convert to the base currency at the exchange rate of the original price
# year, then inflate with the base currency's CPI. Rows with no stated currency
# year are assumed to be in the base year and flagged in the `note` column.

technology_data:
  tag: v0.15.0
  url: "https://raw.githubusercontent.com/PyPSA/technology-data/{tag}/outputs/costs_2025.csv"

base_currency: USD
base_currency_year: 2024
discount_rate: 0.07          # real, Lazard-style commercial WACC (priam-myopic uses 0.02 social)
co2_price_eur_t: 0.0         # set >0 to include carbon cost in LCOE
hours_per_year: 8760

dac:
  capacity_factor: 0.9       # for converting EUR/(tCO2/h) capex to EUR/tCO2 (capex + FOM only)

# Fuel prices (EUR/MWh_th) and CO2 intensity (tCO2/MWh_th). Values come from
# technology-data rows `gas`, `uranium`, `biomass` unless overridden here.
fuel_override: {}
co2_intensity_t_mwh_th:
  gas: 0.198

capture_rate:
  allam-ccs: 0.97

# Capacity-factor band [low, high] used for the LCOE sensitivity range.
capacity_factor:
  solar-utility: [0.12, 0.25]
  onwind: [0.25, 0.45]
  offwind: [0.40, 0.55]
  nuclear-large: [0.85, 0.93]
  smr-nuclear: [0.85, 0.93]
  CCGT: [0.40, 0.85]
  OCGT: [0.05, 0.20]
  hydro: [0.35, 0.55]
  ror: [0.35, 0.55]
  biomass: [0.50, 0.85]
  egs: [0.80, 0.95]
  closed-loop-geo: [0.80, 0.95]
  allam-ccs: [0.60, 0.90]
  sofc: [0.80, 0.95]

# Technology palette. `td` maps our parameters to technology-data technology
# names (parameter name -> technology-data `technology`). Parameters:
#   investment (EUR/kW), investment_kwh (EUR/kWh), investment_kw (EUR/kW, storage
#   power component), FOM (%/year of the matching investment), FOM_kwh (%/year of
#   investment_kwh), VOM, lifetime, efficiency, efficiency_2 (multiplied into
#   efficiency, for charge/discharge pairs), fuel (fuel price row).
# Values missing here (or listed under `gap`) come from data/gap_fill.csv.
# `bar: false` keeps the technology's row and observed points in the figures but
# draws no assumption bar (costs too site-specific for a single number).
# `energy_per_output: true` divides the energy-capacity cost (and its FOM) by the
# discharge efficiency `efficiency_2`, so a fuel store is priced per kWh out.
# Storage entries are ordered by typical discharge duration within each group.
technologies:
  # ---- mature: exogenous DEA/technology-data costs -------------------------
  - key: solar-utility
    label: Solar PV
    group: mature
    kind: generation
    colour: "#f6c945"
    td: {investment: solar-utility, FOM: solar-utility, lifetime: solar-utility}
  - key: onwind
    label: Onshore wind
    group: mature
    kind: generation
    colour: "#74c6f2"
    td: {investment: onwind, FOM: onwind, VOM: onwind, lifetime: onwind}
  - key: offwind
    label: Offshore wind
    group: mature
    kind: generation
    colour: "#3b6fb6"
    td: {investment: offwind, FOM: offwind, VOM: offwind, lifetime: offwind}
  - key: hydro
    label: Hydro (reservoir)
    group: mature
    kind: generation
    colour: "#2a9d8f"
    td: {investment: hydro, FOM: hydro, lifetime: hydro}
  - key: ror
    label: Hydro (run-of-river)
    group: mature
    kind: generation
    colour: "#5fc4b5"
    td: {investment: ror, FOM: ror, lifetime: ror}
  - key: biomass
    label: Biomass
    group: mature
    kind: generation
    colour: "#7d9a3a"
    td: {investment: biomass, FOM: biomass, lifetime: biomass, efficiency: biomass, fuel: biomass}
  - key: nuclear-large
    label: Nuclear (large LWR)
    group: mature
    kind: generation
    colour: "#c94c4c"
    td: {investment: nuclear, FOM: nuclear, VOM: nuclear, lifetime: nuclear, efficiency: nuclear, fuel: uranium}
  - key: CCGT
    label: Gas CCGT
    group: mature
    kind: generation
    colour: "#e5833a"
    td: {investment: CCGT, FOM: CCGT, VOM: CCGT, lifetime: CCGT, efficiency: CCGT, fuel: gas}
  - key: OCGT
    label: Gas OCGT
    group: mature
    kind: generation
    colour: "#f0b27a"
    td: {investment: OCGT, FOM: OCGT, VOM: OCGT, lifetime: OCGT, efficiency: OCGT, fuel: gas}
  - key: battery-liion
    label: Li-ion battery (4 h)
    group: mature
    kind: storage
    colour: "#8d6ccf"
    td: {investment_kwh: battery storage, investment_kw: battery inverter, FOM: battery inverter,
         lifetime: battery storage, efficiency: battery inverter}
  - key: PHS
    label: Pumped hydro (6–20 h)
    group: mature
    kind: storage
    colour: "#1f6f8b"
    # Site-specific in reality; PyPSA-Eur/-Earth default runs keep PHS as fixed existing
    # capacity (powerplantmatching, 6 h) and do not expand it. For a cost bar we use the
    # PNNL 2022 split that PyPSA-Earth maps to (`phs:` in its config) rather than the
    # 2013 DIW `PHS` placeholder: powerhouse per kW + reservoir per kWh.
    td: {investment_kw: Pumped-Storage-Hydro-bicharger, investment_kwh: Pumped-Storage-Hydro-store,
         FOM: Pumped-Storage-Hydro-bicharger, FOM_kwh: Pumped-Storage-Hydro-store,
         lifetime: Pumped-Storage-Hydro-bicharger, efficiency: Pumped-Storage-Hydro-bicharger}
  # ---- advanced: endogenous learning in the study --------------------------
  - key: vrfb
    label: Vanadium flow battery (4–10 h)
    group: advanced
    kind: storage
    colour: "#d977c9"
    td: {investment_kwh: Vanadium-Redox-Flow-store, investment_kw: Vanadium-Redox-Flow-bicharger,
         FOM: Vanadium-Redox-Flow-bicharger, FOM_kwh: Vanadium-Redox-Flow-store,
         lifetime: Vanadium-Redox-Flow-store, efficiency: Vanadium-Redox-Flow-bicharger}
  - key: co2-battery
    label: CO2 battery (10 h)
    group: advanced
    kind: storage
    colour: "#ff7fbf"
    td: {}
  - key: iron-air
    label: Iron-air battery (100 h)
    group: advanced
    kind: storage
    colour: "#b2189a"
    td: {investment_kwh: iron-air battery, FOM_kwh: iron-air battery, lifetime: iron-air battery,
         efficiency: iron-air battery charge, efficiency_2: iron-air battery discharge}
  - key: h2-sofc
    label: H2 tank + SOFC (100+ h)
    group: advanced
    kind: storage
    colour: "#2f9e9e"
    # energy: DEA 151a pressurised tank incl. compressor (per kWh_H2, divided by the
    # SOFC efficiency to express it per kWh of electricity out); power: electrolyser
    # (technology-data) + SOFC (gap_fill, ADD); round trip = electrolysis x SOFC.
    # Salt caverns (DEA 151c, ~3 EUR/kWh_H2) are far cheaper but geology-bound.
    energy_per_output: true
    td: {investment_kwh: hydrogen storage tank type 1 including compressor,
         FOM_kwh: hydrogen storage tank type 1 including compressor,
         lifetime: hydrogen storage tank type 1 including compressor,
         investment_kw: electrolysis, FOM: electrolysis, efficiency: electrolysis}
  - key: smr-nuclear
    label: Nuclear SMR
    group: advanced
    kind: generation
    colour: "#df3439"
    td: {fuel: uranium}
  - key: egs
    label: Enhanced geothermal (EGS)
    group: advanced
    kind: generation
    colour: "#99582a"
    bar: false      # resource-dependent: shown as observed points only
    td: {}
  - key: closed-loop-geo
    label: Closed-loop geothermal
    group: advanced
    kind: generation
    colour: "#c98a5a"
    bar: false      # resource-dependent: shown as observed points only
    td: {}
  - key: allam-ccs
    label: Allam-cycle gas + CCS
    group: advanced
    kind: generation
    colour: "#540b0e"
    td: {investment: allam, VOM: allam, lifetime: allam, efficiency: allam, fuel: gas}
  - key: sofc
    label: Solid oxide fuel cell
    group: advanced
    kind: generation
    colour: "#4a7c59"
    td: {fuel: gas}
  - key: dac
    label: Direct air capture
    group: advanced
    kind: dac
    colour: "#6c757d"
    td: {investment: direct air capture, FOM: direct air capture, lifetime: direct air capture}
  - key: fusion
    label: Fusion
    group: advanced
    kind: note
    colour: "#adb5bd"
    td: {}

# Marker style per observed-point type (matplotlib marker, filled?)
point_type_style:
  final_cost:      {marker: "o", filled: true,  label: "Realised project cost"}
  estimate:        {marker: "^", filled: true,  label: "Project estimate / target"}
  ppa_price:       {marker: "D", filled: true,  label: "PPA / auction price"}
  weighted_average: {marker: "s", filled: false, label: "Global weighted average (IRENA)"}
  benchmark_range: {marker: "|", filled: false, label: "Benchmark range (Lazard, ATB, ...)"}

plotting:
  dpi: 200
  formats: [png, pdf]
  # technologies left out of the 16:9 slide figures (kept in the tables and report figures):
  # closed-loop geothermal has no project data beyond one DOE model value; the SOFC
  # only appears on the storage slide as the discharge side of the hydrogen store.
  slide_exclude: [closed-loop-geo, sofc]
  # curated, numbered references for the slide figures (see beamer/2026-09-08/references.yaml);
  # sources that match no entry there are not cited on the slides
  # curated reference list of the deck the slide figures are made for; the slide
  # figures are skipped when the file is missing
  slide_references: ../../beamer/2026-09-08/references.yaml

# ---- learning curves (figures/learning) --------------------------------------------
# Historical unit cost vs cumulative installed capacity per technology, fitted three
# ways (level Wright's law, first-difference Wright's law after Lafond et al. 2018 /
# Way et al. 2022, and a time trend); see README "Learning curves".
learning:
  min_points: 5                # fewer fit points -> DILIGENCE flag on the dashboard
  schmidt:
    url: https://ndownloader.figshare.com/files/12865736      # dataset update 2018, CC BY 4.0
    doi: 10.1038/nenergy.2017.110
    citation: "Schmidt et al. (2017), Nat. Energy, 2018 update"
  # block-title prefix in the Schmidt "Data" sheet -> palette key, scope and, where the
  # collected series is not the energy/power pair of a storage system, the component it
  # feeds. `context: true` series are drawn hollow and never fitted (different scope).
  schmidt_map:
    "Lithium-ion (Utility":        {technology: battery-liion, scope: system}
    "Lithium-ion (Residential":    {technology: battery-liion, scope: system, context: true}
    "Lithium-ion (EV":             {technology: battery-liion, scope: pack, context: true}
    "Lithium-ion (18650":          {technology: battery-liion, scope: cell, context: true}
    "Lithium-ion (Electronics":    {technology: battery-liion, scope: cell, context: true}
    "Vanadium redox-flow":         {technology: vrfb, scope: system}
    "Electrolysis":                {technology: h2-sofc, scope: system, component: power,
                                    note: "alkaline electrolyser plant only; the SOFC half of the power component has no series"}
    "Fuel Cells (Residential":     {technology: sofc, scope: system, component: plant, context: true,
                                    note: "Staffell & Green 2013 reconstruction of the ENE-FARM programme incl. the 2004-08 demonstration phase; superseded by the official ANRE/ACE series in manual.csv"}
    "PV Modules":                  {technology: solar-utility, scope: module, component: plant, context: true}
    "Pumped hydro":                {technology: PHS, scope: system}
  # Dashboards, in this order. `components` are the panels (energy: USD/kWh vs GWh, power:
  # USD/kW vs GW, plant: USD/kW vs GW or USD/well vs wells). `fit` restricts the fitted
  # series per component (default: every non-context, non-derived series). `analogy` is an
  # assumed rate drawn as a dashed line and labelled as such; it is never fitted.
  technologies:
    vrfb:            {components: [energy, power]}
    h2-sofc:         {components: [energy, power]}
    iron-air:        {components: [energy],
                      analogy: {rate: 0.15, label: "DOE LDES Liftoff 2023 projects with 12–18 %/doubling"}}
    co2-battery:     {components: [energy],
                      analogy: {rate: 0.05, label: "mechanical storage; pumped hydro shows −1 ± 8 % (Schmidt 2018)"}}
    smr-nuclear:     {components: [plant],
                      analogy: {rate: 0.10, label: "scenario value; large-LWR history −ve to 6 % (Rubin 2015)"}}
    egs:             {components: [drilling], show_reference: true}   # USD/ft vs cumulative wells (Fervo); plant capex has no
                                                  # series; the floors.csv band (US shale drilling cost) is drawn
    closed-loop-geo: {components: [plant]}
    allam-ccs:       {components: [plant],
                      analogy: {rate: 0.05, label: "CO2 capture units 2–7 % (Rubin 2015); fuel sets the LCOE floor"}}
    sofc:            {components: [plant], fit: {plant: [enefarm-sofc]}}   # ENE-FARM Type S (SOFC) prices; PEFC series and Schmidt's reconstruction shown as context
    solar-utility:   {components: [plant]}
    onwind:          {components: [plant]}
    battery-liion:   {components: [energy, power], fit: {energy: [bnef-turnkey]}}   # Schmidt utility series shown, not chained (different capacity basis)

  # Series that are drawn as hollow markers but never enter a fit, with the reason that the
  # legend prints after "excluded:". Anything not listed here that is skipped (a series not
  # named under `fit`, or a `context: true` series without an entry) gets a generic reason.
  # Derived series (Schmidt's C-rate conversions of a collected series) are not drawn at all.
  not_fitted:
    "schmidt2018:lithium-ion-electronics-21": "consumer cells, not grid systems"
    "schmidt2018:lithium-ion-electronics-30": "consumer cells, not grid systems"
    "schmidt2018:lithium-ion-18650-cell-19":  "consumer cells, not grid systems"
    "schmidt2018:lithium-ion-ev-9":           "EV packs, not grid systems"
    "schmidt2018:lithium-ion-ev-19":          "EV packs, not grid systems"
    "schmidt2018:lithium-ion-residential-15": "residential systems, other market"
    "schmidt2018:lithium-ion-utility-16":     "pre-2016 systems on another capacity basis"
    "bnef-turnkey-2025":                      "2025 fleet is a BNEF forecast"
    "schmidt2018:pv-modules-23":              "modules only, not whole plants"
    "schmidt2018:fuel-cells-residential-16":  "reconstruction incl. 2004-08 demo units"
    "enefarm-pefc":                           "PEFC units, a different stack"
    "iea-ghr-2025":                           "operating fleet, not cumulative production"
    "vrfb-projects":                          "single projects, cumulative GWh only indicative"
    "form-target":                            "vendor target, nothing deployed yet"
    "energy-dome":                            "vendor estimate, nothing deployed yet"
    "net-power":                              "FOAK estimate, nothing deployed yet"
    "closed-loop-estimates":                  "FOAK estimate / projection, nothing deployed yet"
    "smr-estimates":                          "FOAK estimates, no deployment series"

